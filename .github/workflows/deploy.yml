name: Deploy
on:
    push:
        branches:
          - main
          - develop

jobs:
    test-lint:
        uses: ./.github/workflows/test-and-lint.yml
        name: Test and Lint
        secrets:
            DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    deploy:
        name: Deploy
        runs-on: ubuntu-22.04
        needs: [test-lint]
        env:
          IMAGE_NAME: python-api
          BRANCH_NAME: ${{ github.ref_name }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USER }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set TAG Based on Branch
              run: |
                SHORT_SHA=${GITHUB_SHA::7}
                echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

                if [[ "$BRANCH_NAME" == "develop" ]]; then
                  echo "TAG=develop-$SHORT_SHA" >> $GITHUB_ENV
                  elif [[ "$BRANCH_NAME" == "main" ]]; then
                    echo "TAG=staging-$SHORT_SHA" >> $GITHUB_ENV
                else
                  echo "Branch $BRANCH_NAME not handled!"
                  exit 1
                fi
            
            - name: Build Docker Image
              run: docker build -t "${{ vars.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}" apps/python-api

            - name: Push Docker Image
              run: docker push "${{ vars.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
        
